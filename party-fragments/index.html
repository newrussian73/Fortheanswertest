<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Выделенные фрагменты — Let's Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Outfit:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #05010f;
      --bg-mid: #1a0638;
      --silver: #d8dee8;
      --script: #b8d4f0;
      --glow: #9b5cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Outfit, sans-serif;
      color: var(--silver);
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(120, 40, 180, 0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 70%, rgba(60, 20, 120, 0.45), transparent 50%),
        linear-gradient(165deg, var(--bg-deep), var(--bg-mid) 45%, #0a0218);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,.5), transparent),
        radial-gradient(1.5px 1.5px at 72% 22%, rgba(255,255,255,.65), transparent),
        radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,.4), transparent);
      pointer-events: none;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }

    @keyframes float-y {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      padding: 2.5rem 1.25rem 1rem;
      text-align: center;
      animation: fade-up 0.8s ease both;
    }

    header h1 {
      font-family: Bebas Neue, sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, #fff 10%, #aeb8c8 45%, #6a7382 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 12px rgba(155, 92, 255, 0.35));
    }

    header p {
      margin-top: 0.35rem;
      font-weight: 300;
      opacity: 0.75;
      font-size: 0.95rem;
    }

    .gallery {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3.5rem;
      display: grid;
      gap: 2rem;
    }

    figure {
      margin: 0;
      text-align: center;
      animation: fade-up 0.9s ease both;
    }

    figure:nth-child(1) { animation-delay: 0.1s; }
    figure:nth-child(2) { animation-delay: 0.25s; }
    figure:nth-child(3) { animation-delay: 0.4s; }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      margin-inline: auto;
      border-radius: 4px;
      animation: float-y 4.5s ease-in-out infinite alternate;
    }

    figure:nth-child(2) img { animation-delay: 0.6s; max-width: 720px; }
    figure:nth-child(3) img { animation-delay: 1.2s; max-width: 480px; }
    figure:nth-child(1) img { max-width: 320px; }

    figcaption {
      margin-top: 0.85rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    figcaption .script {
      display: block;
      margin-top: 0.2rem;
      font-family: Great Vibes, cursive;
      font-size: 1.45rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--script);
      opacity: 1;
    }

    .back {
      display: block;
      text-align: center;
      padding-bottom: 2.5rem;
      color: rgba(216, 222, 232, 0.55);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back:hover { color: var(--glow); }
  </style>
</head>
<body>
  <header>
    <h1>LET'S PARTY</h1>
    <p>Выделенные фрагменты из макета</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="disco-ball.png" alt="Диско-шар" width="265" height="275" />
      <figcaption>Диско-шар</figcaption>
    </figure>

    <figure>
      <img src="lets-party.png" alt="Надпись LET'S PARTY" width="670" height="245" />
      <figcaption>Металлический заголовок — LET'S PARTY</figcaption>
    </figure>

    <figure>
      <img src="30-years.png" alt="Надпись 30 years" width="435" height="145" />
      <figcaption>Скриптовая подпись <span class="script">30 years</span></figcaption>
    </figure>
  </main>

  <a class="back" href="../">← На главную</a>
</body>
</html>
