<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Слоговичок — учимся читать!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="sun"></div>
    <div class="hills"></div>
  </div>

  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="hero">
        <div class="mascot-wrap bounce-soft" id="mascot-home">
          <!-- Friendly fox SVG -->
          <svg class="mascot" viewBox="0 0 200 220" aria-hidden="true">
            <ellipse cx="100" cy="200" rx="48" ry="12" fill="rgba(0,0,0,.12)"/>
            <path d="M55 95 C55 50 145 50 145 95 L145 145 C145 175 55 175 55 145 Z" fill="#FF8A3D"/>
            <path d="M70 100 C70 70 130 70 130 100 L130 140 C130 160 70 160 70 140 Z" fill="#FFE8D0"/>
            <path d="M55 70 L40 25 L75 80 Z" fill="#FF8A3D"/>
            <path d="M145 70 L160 25 L125 80 Z" fill="#FF8A3D"/>
            <path d="M58 68 L48 38 L72 78 Z" fill="#FFE8D0"/>
            <path d="M142 68 L152 38 L128 78 Z" fill="#FFE8D0"/>
            <circle cx="82" cy="105" r="8" fill="#2D2A32"/>
            <circle cx="118" cy="105" r="8" fill="#2D2A32"/>
            <circle cx="84" cy="103" r="2.5" fill="#fff"/>
            <circle cx="120" cy="103" r="2.5" fill="#fff"/>
            <ellipse cx="100" cy="120" rx="7" ry="5" fill="#FF5E7E"/>
            <path d="M93 128 Q100 136 107 128" stroke="#2D2A32" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M100 125 L100 132" stroke="#2D2A32" stroke-width="2"/>
            <ellipse cx="45" cy="130" rx="14" ry="18" fill="#FF8A3D" class="paw-left"/>
            <ellipse cx="155" cy="130" rx="14" ry="18" fill="#FF8A3D" class="paw-right"/>
            <circle cx="72" cy="118" r="10" fill="#FFB4A2" opacity=".7"/>
            <circle cx="128" cy="118" r="10" fill="#FFB4A2" opacity=".7"/>
          </svg>
        </div>
        <h1 class="brand">Слоговичок</h1>
        <p class="tagline">Весёлое путешествие по слогам!</p>
        <button class="btn btn-primary pulse" id="btn-start">Играть!</button>
      </div>

      <div class="mode-grid" id="mode-grid">
        <button class="mode-card" data-mode="listen">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="#5BBEFF"/><path d="M28 32v16h10l14 10V22L38 32H28z" fill="#fff"/><path d="M56 30c4 4 4 16 0 20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
          </span>
          <span class="mode-title">Слушай слог</span>
          <span class="mode-desc">Найди тот же слог</span>
        </button>
        <button class="mode-card" data-mode="build">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 80 80"><rect x="8" y="20" width="28" height="40" rx="8" fill="#7ED957"/><rect x="44" y="20" width="28" height="40" rx="8" fill="#FFD93D"/><text x="22" y="48" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Nunito">МА</text><text x="58" y="48" text-anchor="middle" fill="#2D2A32" font-size="18" font-weight="800" font-family="Nunito">МА</text></svg>
          </span>
          <span class="mode-title">Собери слово</span>
          <span class="mode-desc">Сложи слоги вместе</span>
        </button>
        <button class="mode-card" data-mode="picture">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 80 80"><rect x="10" y="14" width="60" height="52" rx="10" fill="#FF8A3D"/><circle cx="30" cy="34" r="8" fill="#FFD93D"/><path d="M14 54l18-16 12 10 10-8 16 14H14z" fill="#7ED957"/></svg>
          </span>
          <span class="mode-title">Угадай слово</span>
          <span class="mode-desc">Картинка и слоги</span>
        </button>
        <button class="mode-card" data-mode="pop">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 80 80"><circle cx="28" cy="36" r="16" fill="#FF6B6B"/><circle cx="56" cy="28" r="12" fill="#5BBEFF"/><circle cx="50" cy="55" r="14" fill="#FFD93D"/><text x="28" y="41" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="Nunito">БА</text></svg>
          </span>
          <span class="mode-title">Лопай шарики</span>
          <span class="mode-desc">Лопни нужный слог</span>
        </button>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <header class="game-bar">
        <button class="btn btn-icon" id="btn-home" aria-label="На главную">←</button>
        <div class="stars" id="stars" aria-label="Звёздочки">
          <span class="star" data-i="0">★</span>
          <span class="star" data-i="1">★</span>
          <span class="star" data-i="2">★</span>
          <span class="star" data-i="3">★</span>
          <span class="star" data-i="4">★</span>
        </div>
        <div class="score-pill" id="score">0</div>
      </header>

      <div class="prompt-area">
        <div class="picture-frame" id="picture-frame" hidden></div>
        <p class="prompt-text" id="prompt-text"></p>
        <button class="btn btn-speak" id="btn-speak" aria-label="Послушать">🔊</button>
      </div>

      <div class="play-area" id="play-area"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- WIN -->
    <section id="screen-win" class="screen">
      <div class="win-card">
        <div class="mascot-wrap celebrate" id="mascot-win"></div>
        <h2>Ура! Ты молодец!</h2>
        <p class="win-score">Звёздочек: <span id="win-stars">0</span></p>
        <div class="win-actions">
          <button class="btn btn-primary" id="btn-again">Ещё раз</button>
          <button class="btn btn-secondary" id="btn-menu">В меню</button>
        </div>
      </div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>
  </div>

  <script src="js/illustrations.js"></script>
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
